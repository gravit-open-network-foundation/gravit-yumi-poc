version: '3.8'

services:
  verifier:
    image: ${REGISTRY:-gravit}/verifier:${VERSION:-latest}
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - VERIFIER_LOG_LEVEL=info
      - VERIFIER_SEMANTIC_THRESHOLD=0.75
      - VERIFIER_ADVERSARIAL_THRESHOLD=0.2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
