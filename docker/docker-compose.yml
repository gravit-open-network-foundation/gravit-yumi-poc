version: '3.8'

services:
  gravit-verifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: gravit-yumi-verifier
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - GROK_API_KEY=${GROK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ../src:/app/src
      - ../examples:/app/examples
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gravit-network

  redis:
    image: redis:7-alpine
    container_name: gravit-redis
    ports:
      - "6379:6379"
    networks:
      - gravit-network

  postgres:
    image: postgres:15-alpine
    container_name: gravit-postgres
    environment:
      POSTGRES_USER: gravit
      POSTGRES_PASSWORD: gravit123
      POSTGRES_DB: gravit_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gravit-network

  prometheus:
    image: prom/prometheus:latest
    container_name: gravit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - gravit-network

  grafana:
    image: grafana/grafana:latest
    container_name: gravit-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - gravit-network

volumes:
  postgres_data:

networks:
  gravit-network:
    driver: bridge
