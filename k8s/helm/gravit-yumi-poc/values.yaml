replicaCount: 3

image:
  repository: gravit/verifier
  tag: latest
  pullPolicy: Always

config:
  logLevel: "info"
  semanticThreshold: 0.75
  adversarialThreshold: 0.2
  maxReasoningSteps: 10
  proofTTLHours: 720
  benchmarkEnabled: true
  metricsEnabled: true

secrets:
  redisUrl: "redis://redis:6379/0"
  databaseUrl: "postgresql://gravit:changeme@postgres:5432/verifier"
  apiKey: "change-me-in-production"

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
