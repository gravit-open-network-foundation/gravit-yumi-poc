apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gravit-yumi-poc.fullname" . }}-config
  labels:
    {{- include "gravit-yumi-poc.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SEMANTIC_THRESHOLD: {{ .Values.config.semanticThreshold | quote }}
  ADVERSARIAL_THRESHOLD: {{ .Values.config.adversarialThreshold | quote }}
  MAX_REASONING_STEPS: {{ .Values.config.maxReasoningSteps | quote }}
  PROOF_TTL_HOURS: {{ .Values.config.proofTTLHours | quote }}
  BENCHMARK_ENABLED: {{ .Values.config.benchmarkEnabled | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  CACHE_ENABLED: {{ .Values.config.cacheEnabled | quote }}
  CACHE_TTL_SECONDS: {{ .Values.config.cacheTTLSeconds | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gravit-yumi-poc.fullname" . }}-secrets
  labels:
    {{- include "gravit-yumi-poc.labels" . | nindent 4 }}
type: Opaque
stringData:
  redisUrl: {{ .Values.secrets.redisUrl | quote }}
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  apiKey: {{ .Values.secrets.apiKey | quote }}
