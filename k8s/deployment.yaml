apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravit-yumi-verifier
  namespace: gravit-system
  labels:
    app: gravit-yumi-verifier
    component: verifier
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gravit-yumi-verifier
  template:
    metadata:
      labels:
        app: gravit-yumi-verifier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: verifier
        image: gravit/verifier:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: VERIFIER_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: gravit-yumi-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gravit-yumi-verifier-hpa
  namespace: gravit-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gravit-yumi-verifier
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
