apiVersion: v1
kind: Service
metadata:
  name: gravit-yumi-verifier
  namespace: gravit-system
  labels:
    app: gravit-yumi-verifier
spec:
  selector:
    app: gravit-yumi-verifier
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: gravit-yumi-verifier-lb
  namespace: gravit-system
  labels:
    app: gravit-yumi-verifier
    type: loadbalancer
spec:
  selector:
    app: gravit-yumi-verifier
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: LoadBalancer
